  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>
  <g fill="#cfe3ff">
    <circle cx="120" cy="54" r="2"/><circle cx="310" cy="250" r="1.6"/><circle cx="520" cy="40" r="1.4"/>
