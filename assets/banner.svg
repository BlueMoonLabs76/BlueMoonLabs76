      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#16325e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/>
