  <circle cx="1000" cy="150" r="80" fill="#e8f1ff" mask="url(#crescent)"/>
  <text x="72" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Blue Moon Labs</text>
  <text x="74" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#b9d4ff">Small open tools and maps about everyday life.</text>
